<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NIDS Dashboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="main-header">
        <div class="logo"><i class="fas fa-shield-alt"></i> NIDS Dashboard</div>
        <div class="header-right">
          <span class="status-dot"></span>
          <span>Live Monitoring</span>
        </div>
      </header>

      <aside class="sidebar">
        <div class="nav-item active" onclick="navigate('/')">
          <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="navigate('/alerts')">
          <i class="fas fa-bell"></i><span>Alerts</span>
        </div>
        <div class="nav-item" onclick="navigate('/analytics')">
          <i class="fas fa-chart-line"></i><span>Analytics</span>
        </div>
        <div class="nav-item" onclick="navigate('/settings')">
          <i class="fas fa-cog"></i><span>Settings</span>
        </div>
      </aside>

      <main class="main-content">
        <h2>🔍 Recent Threat Alerts</h2>
        <div class="alert-card" onclick="navigate('/threat/1')">
          <div class="icon"><i class="fas fa-skull-crossbones"></i></div>
          <div class="info">
            <h3>Brute Force Attack</h3>
            <p>Detected multiple failed SSH logins from IP 192.168.1.105</p>
            <span class="timestamp">Just now</span>
          </div>
        </div>

        <!-- 🔢 Add Accuracy Card Here -->
        <h2>🎯 Model Accuracy</h2>
        <div class="accuracy-card">
          <i class="fas fa-check-circle"></i>
          <span>Current Accuracy:</span>
          <strong>{{ (accuracy * 100) | round(2) }}%</strong>
        </div>

        <h2>📊 Threat Detection Graph</h2>
        <div class="chart-container">
          <canvas id="threatChart" onclick="handleChartClick(event)"></canvas>
        </div>
      </main>
    </div>

    <script>
      function navigate(path) {
        window.location.href = path;
      }

      function handleChartClick(event) {
        viewDetails("1");
      }

      function viewDetails(threatId) {
        window.location.href = `/threat/${threatId}`;
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
