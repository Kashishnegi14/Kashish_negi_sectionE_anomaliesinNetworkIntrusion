<!DOCTYPE html>
<html>
  <head>
    <title>NIDS Dashboard</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="dashboard">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <i class="fas fa-shield-alt"></i>
          <h1>NIDS Dashboard</h1>
        </div>
      </header>

      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="nav-item active" onclick="navigate('/')">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" onclick="navigate('/alerts')">
          <i class="fas fa-bell"></i>
          <span>Alerts</span>
        </div>
        <div class="nav-item" onclick="navigate('/analytics')">
          <i class="fas fa-chart-line"></i>
          <span>Analytics</span>
        </div>
        <div class="nav-item" onclick="navigate('/settings')">
          <i class="fas fa-cog"></i>
          <span>Settings</span>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="main-content">
        <div class="card">
          <h2>Real-Time Threat Detection</h2>
          <div class="chart-container">
            <canvas id="threatChart"></canvas>
          </div>
        </div>

        <div class="card">
          <h2>Recent Alerts</h2>
          <div class="alert" onclick="navigate('/threat/1')">
            <i class="fas fa-skull-crossbones alert-icon"></i>
            <div class="alert-content">
              <h3>Brute Force Attempt</h3>
              <p>From 192.168.1.105 to SSH (Port 22)</p>
              <div class="alert-meta">
                <span class="severity high">High</span>
                <span class="time">2 mins ago</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      function navigate(path) {
        window.location.href = path;
      }

      // Initialize chart
      document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById("threatChart").getContext("2d");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: ["1min", "2min", "3min", "4min", "5min"],
            datasets: [
              {
                label: "Threat Level",
                data: [12, 19, 3, 5, 2],
                borderColor: "#536dfe",
                backgroundColor: "rgba(83, 109, 254, 0.1)",
                borderWidth: 2,
                tension: 0.4,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
          },
        });
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
